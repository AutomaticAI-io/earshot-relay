[project]
name = "earshot-relay"
version = "1.1.2"
description = "Self-hosted relay that lets any tool or agent speak through the Earshot Android app: HTTP, CLI and MCP in, your own S3 bucket out, playback receipts back."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AutomaticAI" }]
requires-python = ">=3.11"
keywords = ["earshot", "s3", "tts", "mcp", "notifications", "android"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "boto3>=1.35,<2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "python-multipart>=0.0.18",
    "mcp>=2.3,<3",
]

[project.urls]
Homepage = "https://store.automaticai.io/earshot/"

[project.scripts]
earshot-relay = "earshot_relay.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "moto[server]>=5",
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/earshot_relay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning:botocore.*"]
