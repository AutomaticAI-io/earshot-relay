components:
  schemas:
    DeviceStateModel:
      properties:
        device:
          type: string
          title: Device
        status:
          type: string
          enum:
          - detected
          - started
          - finished
          - skipped
          - failed
          - missed
          title: Status
        app_version:
          type: string
          title: App Version
      type: object
      required:
      - device
      - status
      - app_version
      title: DeviceStateModel
    DoctorCheck:
      properties:
        name:
          type: string
          title: Name
        ok:
          type: boolean
          title: Ok
        detail:
          type: string
          title: Detail
      type: object
      required:
      - name
      - ok
      - detail
      title: DoctorCheck
    DoctorResponse:
      properties:
        ok:
          type: boolean
          title: Ok
          description: The inert test write succeeded
        relay:
          $ref: '#/components/schemas/StatusRelay'
        write:
          $ref: '#/components/schemas/DoctorWrite'
        checks:
          items:
            $ref: '#/components/schemas/DoctorCheck'
          type: array
          title: Checks
        beacon_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Beacon Url
        beacon_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Beacon Path
      type: object
      required:
      - ok
      - relay
      - write
      - checks
      - beacon_url
      - beacon_path
      title: DoctorResponse
    DoctorWrite:
      properties:
        ok:
          type: boolean
          title: Ok
        key:
          type: string
          title: Key
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
      type: object
      required:
      - ok
      - key
      - error
      title: DoctorWrite
    ErrorBody:
      properties:
        code:
          type: string
          title: Code
          description: Stable snake_case error code
        message:
          type: string
          title: Message
        field:
          anyOf:
          - type: string
          - type: 'null'
          title: Field
      type: object
      required:
      - code
      - message
      title: ErrorBody
    ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      type: object
      required:
      - error
      title: ErrorResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Health:
      properties:
        ok:
          type: boolean
          title: Ok
      type: object
      required:
      - ok
      title: Health
    HopModel:
      properties:
        phase:
          type: string
          enum:
          - detected
          - started
          - finished
          - failed
          - missed
          title: Phase
        device:
          type: string
          title: Device
        at:
          type: string
          title: At
          description: Phone clock, as the phone reported it
        at_server:
          type: string
          title: At Server
          description: 'at minus clock_skew_ms: the hop on the S3 server clock'
        received_at:
          type: string
          title: Received At
          description: Relay clock when the beacon arrived
        clock_skew_ms:
          anyOf:
          - type: integer
          - type: 'null'
          title: Clock Skew Ms
          description: Phone clock minus S3 server clock, as the phone estimated it
        since_upload_ms:
          anyOf:
          - type: integer
          - type: 'null'
          title: Since Upload Ms
          description: at_server minus the object's LastModified
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
          description: Device error text; 'skipped' on a finished hop means the user skipped it
      type: object
      required:
      - phase
      - device
      - at
      - at_server
      - received_at
      - clock_skew_ms
      - since_upload_ms
      - error
      title: HopModel
    MessageAccepted:
      properties:
        id:
          type: string
          title: Id
          description: Message id, msg_<32 hex>
        type:
          type: string
          enum:
          - text
          - audio
          title: Type
        speech:
          anyOf:
          - type: string
            enum:
            - device
            - server
          - type: 'null'
          title: Speech
          description: null for audio
        channel:
          type: string
          title: Channel
        status:
          type: string
          enum:
          - stored
          - coalescing
          - suppressed
          title: Status
          description: 'stored: in the bucket (delivery to the phone is asynchronous; not played yet).
            coalescing: held until write_at, then written with the latest text under the tag (202). suppressed:
            dropped by cooldown_s, nothing written; id and key are those of the message that started the
            cooldown (200).'
        created_at:
          type: string
          title: Created At
        key:
          anyOf:
          - type: string
          - type: 'null'
          title: Key
          description: 'Object key <channel>/<32 hex>.<ext> (opaque; never derived from the text). null
            while coalescing: the key is <channel>/<hex of id>.<ext> once written.'
        receipt_url:
          type: string
          title: Receipt Url
        tag:
          anyOf:
          - type: string
          - type: 'null'
          title: Tag
          description: The tag the message was sent with
        normalized:
          type: boolean
          title: Normalized
          description: The normalizer changed the text
          default: false
        truncated:
          type: boolean
          title: Truncated
          description: The text was cut at EARSHOT_RELAY_MAX_WORDS
          default: false
        write_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Write At
          description: 'coalescing: when the held message will be written'
        cooldown_until:
          anyOf:
          - type: string
          - type: 'null'
          title: Cooldown Until
          description: 'suppressed: when the cooldown ends'
      type: object
      required:
      - id
      - type
      - speech
      - channel
      - status
      - created_at
      - key
      - receipt_url
      title: MessageAccepted
    MessageList:
      properties:
        items:
          items:
            $ref: '#/components/schemas/ReceiptSummary'
          type: array
          title: Items
        next_since:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Since
          description: Pass as since= to fetch messages newer than this page
      type: object
      required:
      - items
      - next_since
      title: MessageList
    Receipt:
      properties:
        id:
          type: string
          title: Id
        type:
          type: string
          enum:
          - text
          - audio
          title: Type
        speech:
          anyOf:
          - type: string
            enum:
            - device
            - server
          - type: 'null'
          title: Speech
        channel:
          type: string
          title: Channel
        key:
          anyOf:
          - type: string
          - type: 'null'
          title: Key
        created_at:
          type: string
          title: Created At
        status:
          type: string
          enum:
          - stored
          - coalescing
          - write_failed
          - detected
          - started
          - finished
          - skipped
          - failed
          - missed
          - unconfirmed
          title: Status
          description: stored | coalescing | write_failed | detected | started | finished | skipped |
            failed | missed | unconfirmed. A receipt records what the phone did (device playback); it
            is never proof that a person heard the message.
        status_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Status At
        object_last_modified:
          anyOf:
          - type: string
          - type: 'null'
          title: Object Last Modified
          description: The object's LastModified as the phone reported it
        devices:
          items:
            $ref: '#/components/schemas/DeviceStateModel'
          type: array
          title: Devices
        hint:
          anyOf:
          - type: string
          - type: 'null'
          title: Hint
        hops:
          items:
            $ref: '#/components/schemas/HopModel'
          type: array
          title: Hops
          description: One hop per (device, phase), earliest kept, ordered by server time
      type: object
      required:
      - id
      - type
      - speech
      - channel
      - key
      - created_at
      - status
      - status_at
      - object_last_modified
      - devices
      - hint
      - hops
      title: Receipt
    ReceiptSummary:
      properties:
        id:
          type: string
          title: Id
        type:
          type: string
          enum:
          - text
          - audio
          title: Type
        speech:
          anyOf:
          - type: string
            enum:
            - device
            - server
          - type: 'null'
          title: Speech
        channel:
          type: string
          title: Channel
        key:
          anyOf:
          - type: string
          - type: 'null'
          title: Key
        created_at:
          type: string
          title: Created At
        status:
          type: string
          enum:
          - stored
          - coalescing
          - write_failed
          - detected
          - started
          - finished
          - skipped
          - failed
          - missed
          - unconfirmed
          title: Status
          description: stored | coalescing | write_failed | detected | started | finished | skipped |
            failed | missed | unconfirmed. A receipt records what the phone did (device playback); it
            is never proof that a person heard the message.
        status_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Status At
        object_last_modified:
          anyOf:
          - type: string
          - type: 'null'
          title: Object Last Modified
          description: The object's LastModified as the phone reported it
        devices:
          items:
            $ref: '#/components/schemas/DeviceStateModel'
          type: array
          title: Devices
        hint:
          anyOf:
          - type: string
          - type: 'null'
          title: Hint
      type: object
      required:
      - id
      - type
      - speech
      - channel
      - key
      - created_at
      - status
      - status_at
      - object_last_modified
      - devices
      - hint
      title: ReceiptSummary
    StatusBucket:
      properties:
        endpoint_host:
          type: string
          title: Endpoint Host
        name:
          type: string
          title: Name
        last_write_ok_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Write Ok At
      type: object
      required:
      - endpoint_host
      - name
      - last_write_ok_at
      title: StatusBucket
    StatusCompat:
      properties:
        enabled:
          items:
            type: string
            enum:
            - ntfy
            - gotify
            - pushover
            - join
          type: array
          title: Enabled
          description: 'Producer-compat protocols switched on with EARSHOT_RELAY_COMPAT (empty: off)'
        paths:
          additionalProperties:
            type: string
          type: object
          title: Paths
          description: Base path of each enabled protocol on this listener
        port:
          anyOf:
          - type: integer
          - type: 'null'
          title: Port
          description: 'EARSHOT_RELAY_COMPAT_PORT: the same protocols at the root of a second listener,
            for clients that take only a host (Apprise ntfy://)'
        alarm:
          type: boolean
          title: Alarm
          description: A sender's top priority reaches the alarm channel (EARSHOT_RELAY_COMPAT_ALARM=1
            and alarm in EARSHOT_RELAY_CHANNELS); otherwise it plays as a normal item
        ntfy_topics:
          additionalProperties:
            type: string
          type: object
          title: Ntfy Topics
          description: ntfy topic -> channel; any other topic is 404
        pushover_token:
          type: boolean
          title: Pushover Token
          description: EARSHOT_RELAY_COMPAT_PUSHOVER_TOKEN is set (the value is never shown)
        send_token:
          type: boolean
          title: Send Token
          description: 'EARSHOT_RELAY_COMPAT_TOKEN is set: a send-only token for every compat route (the
            value is never shown)'
      type: object
      required:
      - enabled
      - paths
      - port
      - alarm
      - ntfy_topics
      - pushover_token
      - send_token
      title: StatusCompat
    StatusDevice:
      properties:
        device:
          type: string
          title: Device
        last_seen:
          type: string
          title: Last Seen
          description: Relay clock when this device's latest beacon arrived
        app_version:
          type: string
          title: App Version
        last_phase:
          type: string
          title: Last Phase
        clock_skew_ms:
          anyOf:
          - type: integer
          - type: 'null'
          title: Clock Skew Ms
      type: object
      required:
      - device
      - last_seen
      - app_version
      - last_phase
      - clock_skew_ms
      title: StatusDevice
    StatusHygiene:
      properties:
        normalize:
          type: string
          enum:
          - 'off'
          - basic
          title: Normalize
          description: 'EARSHOT_RELAY_NORMALIZE: the default for text; a request''s normalize field overrides
            it'
        max_words:
          anyOf:
          - type: integer
          - type: 'null'
          title: Max Words
          description: EARSHOT_RELAY_MAX_WORDS (applies when text is normalized)
        coalescing_pending:
          type: integer
          title: Coalescing Pending
          description: Messages held right now for coalesce_window_s
        coalescing_failed:
          type: integer
          title: Coalescing Failed
          description: Held messages whose write failed every retry, still inside retention (their receipt
            reads write_failed)
      type: object
      required:
      - normalize
      - max_words
      - coalescing_pending
      - coalescing_failed
      title: StatusHygiene
    StatusLimits:
      properties:
        rate_limit:
          anyOf:
          - type: string
          - type: 'null'
          title: Rate Limit
        alarm_rate_limit:
          anyOf:
          - type: string
          - type: 'null'
          title: Alarm Rate Limit
        max_audio_bytes:
          type: integer
          title: Max Audio Bytes
        receipt_wait_min:
          type: integer
          title: Receipt Wait Min
        retention_days:
          type: integer
          title: Retention Days
      type: object
      required:
      - rate_limit
      - alarm_rate_limit
      - max_audio_bytes
      - receipt_wait_min
      - retention_days
      title: StatusLimits
    StatusReceipts:
      properties:
        configured:
          type: boolean
          title: Configured
        beacon_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Beacon Url
          description: 'Paste into the app''s ''Optional HTTPS beacon endpoint''. Contains the beacon
            token: shown only here, never logged. null when EARSHOT_RELAY_PUBLIC_URL is unset.'
        beacon_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Beacon Path
          description: The beacon path (with token) to append to your public https origin
        separate_beacon_port:
          anyOf:
          - type: integer
          - type: 'null'
          title: Separate Beacon Port
        last_beacon_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Beacon At
        devices:
          items:
            $ref: '#/components/schemas/StatusDevice'
          type: array
          title: Devices
          description: Last beacon per device. Buyer builds send no heartbeat, so this is not liveness.
        note:
          type: string
          title: Note
      type: object
      required:
      - configured
      - beacon_url
      - beacon_path
      - separate_beacon_port
      - last_beacon_at
      - devices
      - note
      title: StatusReceipts
    StatusRelay:
      properties:
        version:
          type: string
          title: Version
      type: object
      required:
      - version
      title: StatusRelay
    StatusResponse:
      properties:
        relay:
          $ref: '#/components/schemas/StatusRelay'
        bucket:
          $ref: '#/components/schemas/StatusBucket'
        channels:
          items:
            type: string
          type: array
          title: Channels
        default_channel:
          type: string
          title: Default Channel
        speech:
          $ref: '#/components/schemas/StatusSpeech'
        receipts:
          $ref: '#/components/schemas/StatusReceipts'
        limits:
          $ref: '#/components/schemas/StatusLimits'
        compat:
          $ref: '#/components/schemas/StatusCompat'
        hygiene:
          $ref: '#/components/schemas/StatusHygiene'
        watchdog:
          $ref: '#/components/schemas/StatusWatchdog'
      type: object
      required:
      - relay
      - bucket
      - channels
      - default_channel
      - speech
      - receipts
      - limits
      - compat
      - hygiene
      - watchdog
      title: StatusResponse
    StatusSpeech:
      properties:
        default:
          type: string
          enum:
          - device
          - server
          title: Default
        server_configured:
          type: boolean
          title: Server Configured
        provider:
          anyOf:
          - type: string
            enum:
            - openai
            - elevenlabs
            - gemini
          - type: 'null'
          title: Provider
          description: The TTS provider, when server speech is configured
      type: object
      required:
      - default
      - server_configured
      title: StatusSpeech
    StatusWatchdog:
      properties:
        enabled:
          type: boolean
          title: Enabled
          description: EARSHOT_RELAY_WATCHDOG_S is set (it needs receipts and a notice URL)
        reason:
          anyOf:
          - type: string
            enum:
            - beacon_token_missing
            - not_configured
          - type: 'null'
          title: Reason
          description: Why the watchdog is disabled, when enabled=false
        after_s:
          anyOf:
          - type: integer
          - type: 'null'
          title: After S
        cooldown_s:
          anyOf:
          - type: integer
          - type: 'null'
          title: Cooldown S
        format:
          anyOf:
          - type: string
            enum:
            - json
            - text
          - type: 'null'
          title: Format
          description: 'Body of the notice: JSON webhook, or plain text for an ntfy-style URL'
        target_host:
          anyOf:
          - type: string
          - type: 'null'
          title: Target Host
          description: Host of the notice URL. The URL itself is never shown.
        state:
          anyOf:
          - type: string
            enum:
            - idle
            - incident
            - notified
          - type: 'null'
          title: State
          description: 'idle: nothing wrong. incident: a message got no playback report in time, notice
            pending. notified: the one notice for this incident was sent (or given up on).'
        incident_since:
          anyOf:
          - type: string
          - type: 'null'
          title: Incident Since
        incident_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Incident Message
        incident_kind:
          anyOf:
          - type: string
            enum:
            - silent
            - write_failed
          - type: 'null'
          title: Incident Kind
          description: 'silent: a stored message no device reported on. write_failed: a held message the
            relay accepted but could not write'
        last_notice_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Notice At
        last_notice_ok:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Last Notice Ok
        last_error:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Error
          description: Why the last notice failed (never contains the URL)
        notices_sent:
          anyOf:
          - type: integer
          - type: 'null'
          title: Notices Sent
        note:
          anyOf:
          - type: string
          - type: 'null'
          title: Note
          description: 'It watches sends, not idle phones: the app sends no heartbeat.'
      type: object
      required:
      - enabled
      title: StatusWatchdog
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
tags:
- name: core
  description: 'Messages and status: the portable part of the API.'
- name: relay
  description: 'Relay-only: the phone''s beacon endpoint and doctor.'
- name: compat
  description: 'Producer-compat ingress: ntfy, Gotify, Pushover and Join request shapes, each off unless
    EARSHOT_RELAY_COMPAT lists it. See docs/compat.md.'
