# Status: untested. This workflow has not been run; it was written from the API contract.
# GitHub Actions step: tell your phone when a job finishes or fails.
# Needs a relay the runner can reach (a tunnel hostname). Store the URL and token as repository secrets.
# Note: this sends the text below to your bucket. Keep it short and free of secrets.
name: notify-phone
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
jobs:
  speak:
    runs-on: ubuntu-latest   # any runner that can reach your relay works
    steps:
      - name: Say it on the phone
        env:
          EARSHOT_API_URL: ${{ secrets.EARSHOT_API_URL }}
          EARSHOT_API_TOKEN: ${{ secrets.EARSHOT_API_TOKEN }}
          RESULT: ${{ github.event.workflow_run.conclusion }}
          REPO: ${{ github.repository }}
          # One key per CI run attempt: curl's retries and a re-run of this job return the first result instead of
          # speaking twice, while a re-run of CI itself (a new attempt) speaks again.
          IDEMPOTENCY_KEY: ci-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
        run: |
          curl -fsS --retry 3 -X POST "$EARSHOT_API_URL/v1/messages" \
            -H "Authorization: Bearer $EARSHOT_API_TOKEN" \
            -H "Content-Type: application/json" \
            -H "Idempotency-Key: $IDEMPOTENCY_KEY" \
            -d "$(jq -n --arg text "CI ${RESULT} for ${REPO##*/}" '{text: $text}')"
