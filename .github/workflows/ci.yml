name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          # tests/test_scoped_service.py replays the legacy relay with `git archive 4206b81`,
          # which a depth-1 checkout doesn't have.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv run python scripts/gen_openapi.py --check
  docker-smoke:
    # Spec 15.9: build the image, run it against moto, curl send, replayed beacons, receipt finished.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run python scripts/docker_smoke.py --image earshot-relay:ci-${{ github.run_id }}
      - if: always()
        run: docker image rm -f earshot-relay:ci-${{ github.run_id }} || true
  providers:
    # Spec 15.4: PutObject against SeaweedFS and Garage containers with a write-only key.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run pytest -q tests/test_providers.py
        env:
          EARSHOT_COMPAT_PROVIDERS: "1"
